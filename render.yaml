services:
  - type: web
    name: safejobs
    env: python
    buildCommand: "pip install -r requirements.txt && python -m database.seed_data"
    startCommand: "gunicorn app:app"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
